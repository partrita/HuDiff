[project]
authors = [{ name = "deepthought", email = "deepthough@postech.ac.kr" }]
name = "HuDiff"
requires-python = ">= 3.9"
version = "0.1.0"
dependencies = ["sequence-models>=1.8.0,<2"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda", "pytorch"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
hudiff = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "==3.9"
pytorch = "==1.13.0"
torchvision = "==0.14.0"
torchaudio = "==0.13.0"
pytorch-cuda = ">=12.4,<13"
abnumber = ">=0.4.4,<0.5"
pip = ">=25.1.1,<26"
pandas = ">=2.3.1,<3"
scipy = ">=1.13.1,<2"
scikit-learn = ">=1.6.1,<2"
tqdm = ">=4.67.1,<5"
tensorboard = ">=2.11.2,<3"
easydict = ">=1.13,<2"
pyyaml = ">=6.0.2,<7"
einops = ">=0.8.1,<0.9"
matplotlib = ">=3.9.1,<4"
seaborn = ">=0.13.2,<0.14"
python-lmdb = ">=1.6.2,<2"
pymol-open-source = ">=2.5.0,<3"
